name: Lab testing in pull requests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      run-optional-cg:
        type: choice
        options:
          - skip
          - free
          - affect
        default: 'free'
        description: 'Skip optional cg check, run and not affect the result, run and affect the result'

env:
  BASE_BRANCH: origin/${{ github.event.pull_request.base.ref }}

jobs:
  branch:
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Branch
        working-directory: ${{ github.workspace }}
        run: $TEST_DIR/validate-branch.sh
        shell: bash

  content:
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Content
        working-directory: ${{ github.workspace }}
        run: $TEST_DIR/validate-files.sh
        shell: bash

  author:
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Author
        working-directory: ${{ github.workspace }}
        run: $TEST_DIR/validate-student.sh
        shell: bash

  build:
    needs: [content, author, branch]
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build
        working-directory: ${{ github.workspace }}
        run: $TEST_DIR/build.sh
        shell: bash
      - name: Build results
        uses: actions/upload-artifact@v5
        with:
          name: labs
          path: ${{ github.workspace }}/out
          overwrite: true
